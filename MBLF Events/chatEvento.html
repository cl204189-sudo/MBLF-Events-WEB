<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat do evento - MBLF Events</title>
  <link href="imagem/LOGO2.png" rel="icon" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    body { background: var(--bg-body, #f8fafc); color: var(--text-main, #1e293b); transition: background-color .2s, color .2s; }
    .chat-lista { height: min(62vh, 620px); min-height: 280px; overflow-y: auto; background: var(--bg-card, #fff) !important; color: var(--text-main, #1e293b); }
    .chat-msg { max-width: 85%; border-radius: 1rem; padding: .7rem .9rem; overflow-wrap: anywhere; }
    .chat-minha { margin-left: auto; background: var(--bs-primary); color: white; }
    .chat-outra { margin-right: auto; background: rgba(127,127,127,.12); color: var(--text-main, inherit); }
    .chat-meta { font-size: .75rem; opacity: .8; margin-bottom: .2rem; }
    #formMensagem { background: var(--bg-card, #fff); border-color: var(--input-border, #dee2e6) !important; }
    #textoMensagem { background: var(--bg-input, #fff); color: var(--text-main, #212529); border-color: var(--input-border, #ced4da); }
    #textoMensagem::placeholder { color: var(--text-muted, #6c757d); }
    [data-theme="dark"] body { background: #0f172a; color: #f8fafc; }
    [data-theme="dark"] .chat-lista, [data-theme="dark"] #formMensagem { background: #1e293b !important; color: #f8fafc; }
    [data-theme="dark"] .chat-outra { background: #334155; color: #f8fafc; }
    [data-theme="dark"] #textoMensagem { background: #0f172a; color: #f8fafc; border-color: #475569; }
    [data-theme="dark"] .card-custom { background: #1e293b; border-color: #334155; }
    [data-theme="dark"] .dropdown-menu { background: #1e293b; border-color: #334155; }
    [data-theme="dark"] .dropdown-item { color: #f8fafc; }
    [data-theme="dark"] .dropdown-item:hover { background: #334155; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark navbar-mblf shadow-sm py-2">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="painel.html">
      <img alt="MBLF Events" class="brand-logo" src="imagem/LOGO3.png"><span>MBLF Events</span>
    </a>
    <div class="controles-pagina">
      <div class="dropdown">
        <button class="btn btn-outline-light btn-sm dropdown-toggle" id="dropdownIdiomaChat" data-bs-toggle="dropdown" aria-expanded="false" title="Selecionar idioma" aria-label="Selecionar idioma"><i class="bi bi-translate me-1"></i><img id="flag-idiomaAtualChat" src="https://flagcdn.com/24x18/br.png" width="24" height="18" alt="Português" style="object-fit:cover;vertical-align:middle;margin-right:.35rem;"><span id="idiomaAtualChat">PT</span></button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownIdiomaChat">
          <li><button class="dropdown-item" type="button" onclick="selecionarIdioma('pt')">🇧🇷 Português</button></li>
          <li><button class="dropdown-item" type="button" onclick="selecionarIdioma('en')">🇺🇸 English</button></li>
          <li><button class="dropdown-item" type="button" onclick="selecionarIdioma('es')">🇪🇸 Español</button></li>
        </ul>
      </div>
      <button class="btn btn-outline-light btn-sm" onclick="alternarTema()" type="button" title="Alternar tema" aria-label="Alternar tema"><i class="bi bi-moon-stars-fill" id="icone-tema"></i></button>
      <a class="btn btn-outline-light btn-sm" id="voltarEvento" href="explorar.html"><i class="bi bi-arrow-left me-1"></i>Voltar ao evento</a>
    </div>
  </div>
</nav>
<main class="container py-4 flex-grow-1">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
    <div><h2 class="fw-bold text-main-theme mb-1"><i class="bi bi-chat-dots-fill text-primary me-2"></i><span id="tituloEvento">Chat global do evento</span></h2>
      <p class="text-muted-theme mb-0">Conversa entre organizador, participantes inscritos e colaboradores aceitos.</p></div>
    <button class="btn btn-outline-primary" id="atualizarChat" type="button"><i class="bi bi-arrow-clockwise me-1"></i>Atualizar</button>
  </div>
  <div class="alert d-none" id="alertaChat" role="alert"></div>
  <section class="card card-custom border-0 shadow-sm overflow-hidden">
    <div class="chat-lista p-3 d-flex flex-column gap-3" id="listaMensagens" aria-live="polite">
      <div class="text-center text-muted-theme py-5">Carregando mensagens...</div>
    </div>
    <form id="formMensagem" class="border-top p-3">
      <label class="form-label" for="textoMensagem">Sua mensagem</label>
      <div class="input-group">
        <input class="form-control" id="textoMensagem" maxlength="1000" autocomplete="off" placeholder="Escreva uma mensagem..." required>
        <button class="btn btn-mblf-primary" id="enviarMensagem" type="submit"><i class="bi bi-send-fill me-1"></i>Enviar</button>
      </div>
      <small class="text-muted-theme">Mensagens de até 1.000 caracteres.</small>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/chatEvento.js"></script>
</body>
</html>
