<!doctype html>
<html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relatório do evento - MBLF Events</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><style>
body { background: var(--bg-body, #f8f9fa); color: var(--text-main, #212529); min-height:100vh; transition: background-color .3s ease, color .3s ease; }
.card-custom { background: var(--card-bg, #fff); color: var(--text-main, inherit); border:1px solid var(--input-border, #dee2e6); box-shadow: var(--card-shadow, none); transition: background-color .3s ease, color .3s ease, border-color .3s ease; }
.text-muted { color: var(--text-muted, #6c757d) !important; }
[data-theme="dark"] body { background:#0f172a; color:#f8fafc; }
[data-theme="dark"] .card-custom { background:#1e293b; color:#f8fafc; border-color:#334155; }
[data-theme="dark"] .text-muted { color:#cbd5e1 !important; }
.controles-pagina { display:flex; align-items:center; gap:.5rem; }
@media print { .nao-imprimir, #alerta { display:none !important; } body { background:#fff !important; color:#000 !important; } .card-custom { break-inside:avoid; box-shadow:none !important; background:#fff !important; color:#000 !important; } }
</style></head>
<body class="container py-4">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 nao-imprimir"><h1 class="h3 mb-0" data-i18n="relTitulo">Relatório do evento</h1><div class="controles-pagina">
<div class="dropdown"><button class="btn btn-outline-secondary dropdown-toggle" id="dropdownIdiomaRelatorio" data-bs-toggle="dropdown" aria-expanded="false" title="Selecionar idioma" aria-label="Selecionar idioma"><i class="bi bi-translate me-1"></i><img id="flag-idiomaAtualRelatorio" src="https://flagcdn.com/24x18/br.png" width="24" height="18" alt="Português" style="object-fit:cover;vertical-align:middle;margin-right:.35rem;"><span id="idiomaAtualRelatorio">PT</span></button><ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownIdiomaRelatorio"><li><button class="dropdown-item" type="button" onclick="selecionarIdioma('pt')">🇧🇷 Português</button></li><li><button class="dropdown-item" type="button" onclick="selecionarIdioma('en')">🇺🇸 English</button></li><li><button class="dropdown-item" type="button" onclick="selecionarIdioma('es')">🇪🇸 Español</button></li></ul></div>
<button class="btn btn-outline-secondary" id="btnAlternarTemaRelatorio" onclick="alternarTema()" type="button" title="Alternar tema" aria-label="Alternar tema" data-i18n-title="temaAlternar" data-i18n-aria-label="temaAlternar"><i class="bi bi-moon-stars-fill" id="icone-tema"></i></button><a id="voltar" class="btn btn-outline-secondary" href="hubEvento.html" data-i18n="hubVoltar">Voltar ao Hub</a></div></div>
<div id="alerta" class="alert d-none"></div><div id="relatorio" class="row g-3"></div>
<button id="baixarPdf" class="btn btn-primary mt-4 nao-imprimir" disabled data-i18n="relExportarPdf">Exportar PDF</button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/i18n.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{const tema=localStorage.getItem('mblfTema')||'light';document.documentElement.setAttribute('data-theme',tema==='dark'?'dark':'light');const icone=document.getElementById('icone-tema');if(icone)icone.className=tema==='dark'?'bi bi-sun-fill':'bi bi-moon-stars-fill';});</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const i=document.getElementById('idiomaAtualRelatorio');const atualizar=()=>{if(i)i.textContent=({pt:'PT',en:'EN',es:'ES'})[window.I18n?.getIdioma?.()||'pt']||'PT'};atualizar();document.addEventListener('mblf:idiomaAlterado',atualizar);});</script>
<script src="js/auth.js"></script><script src="js/relatorioEvento.js"></script></body></html>
