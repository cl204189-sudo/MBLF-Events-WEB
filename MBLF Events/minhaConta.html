<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title data-i18n="contaTituloPagina">
        Minha Conta - MBLF Events
    </title>

    <link
        rel="icon"
        type="image/png"
        href="imagem/LOGO2.png"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="d-flex flex-column min-vh-100">


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav
    class="navbar navbar-expand-lg navbar-dark navbar-mblf shadow-sm py-2"
>

    <div class="container">

        <a
            class="navbar-brand d-flex align-items-center gap-2 fw-bold"
            href="painel.html"
        >

            <img
                src="imagem/LOGO3.png"
                alt="MBLF Events"
                class="brand-logo"
            >

            <span class="fs-4">
                MBLF Events
            </span>

        </a>


        <div class="d-flex align-items-center gap-2">


            <!-- TEMA -->

            <button
                class="btn btn-outline-light btn-sm"
                type="button"
                onclick="alternarTema()"
                title="Alternar tema"
                aria-label="Alternar tema"
                data-i18n-title="temaAlternar"
                data-i18n-aria-label="temaAlternar"
            >

                <i
                    id="icone-tema"
                    class="bi bi-moon-stars-fill"
                ></i>

            </button>


            <!-- IDIOMA -->

            <div class="dropdown">

                <button
                    class="btn btn-sm btn-outline-light dropdown-toggle"
                    type="button"
                    id="dropdownIdioma"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    aria-label="Selecionar idioma"
                    data-i18n-aria-label="idiomaSelecionar"
                >

                    <img
                        id="bandeira-atual"
                        src="https://flagcdn.com/24x18/br.png"
                        alt="Português"
                        width="20"
                        height="15"
                        class="rounded-1"
                    >

                </button>


                <ul
                    class="dropdown-menu dropdown-menu-end shadow-sm"
                    aria-labelledby="dropdownIdioma"
                >

                    <li>

                        <button
                            class="dropdown-item d-flex align-items-center gap-2"
                            type="button"
                            onclick="selecionarIdioma('pt')"
                        >

                            <img
                                src="https://flagcdn.com/24x18/br.png"
                                alt="Português"
                                width="20"
                                height="15"
                            >

                            PT

                        </button>

                    </li>


                    <li>

                        <button
                            class="dropdown-item d-flex align-items-center gap-2"
                            type="button"
                            onclick="selecionarIdioma('en')"
                        >

                            <img
                                src="https://flagcdn.com/24x18/us.png"
                                alt="English"
                                width="20"
                                height="15"
                            >

                            EN

                        </button>

                    </li>


                    <li>

                        <button
                            class="dropdown-item d-flex align-items-center gap-2"
                            type="button"
                            onclick="selecionarIdioma('es')"
                        >

                            <img
                                src="https://flagcdn.com/24x18/es.png"
                                alt="Español"
                                width="20"
                                height="15"
                            >

                            ES

                        </button>

                    </li>

                </ul>

            </div>


            <!-- VOLTAR -->

            <a
                href="painel.html"
                class="btn btn-outline-light btn-sm"
            >

                <i class="bi bi-arrow-left me-1"></i>

                <span data-i18n="contaVoltarPainel">
                    Voltar ao Painel
                </span>

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="container py-5">

    <div class="mb-4">

        <h2 class="fw-bold text-main-theme mb-1">

            <i class="bi bi-person-gear me-2"></i>

            <span data-i18n="contaTitulo">
                Minha Conta
            </span>

        </h2>

        <p
            class="text-muted-theme mb-0"
            data-i18n="contaSubtitulo"
        >
            Gerencie seus dados pessoais e sua senha.
        </p>

    </div>


    <!-- ALERTA GERAL -->

    <div
        id="alertConta"
        class="alert d-none"
        role="alert"
    ></div>


    <div class="row g-4">


        <!-- =================================================
             DADOS PESSOAIS
        ================================================== -->

        <div class="col-12 col-lg-7">

            <div
                class="card card-custom border-0 shadow-sm h-100"
            >

                <div class="card-body p-4">

                    <div class="mb-4">

                        <h4 class="fw-bold text-main-theme mb-1">

                            <i class="bi bi-person me-2 text-primary"></i>

                            <span data-i18n="contaDadosPessoais">
                                Dados pessoais
                            </span>

                        </h4>

                        <p
                            class="small text-muted-theme mb-0"
                            data-i18n="contaDadosPessoaisDesc"
                        >
                            Atualize as informações da sua conta.
                        </p>

                    </div>


                    <form id="formDadosConta">


                        <!-- NOME -->

                        <div class="mb-3">

                            <label
                                for="inputContaNome"
                                class="form-label fw-semibold"
                                data-i18n="cadastroNome"
                            >
                                Nome completo
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="inputContaNome"
                                autocomplete="name"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-4">

                            <label
                                for="inputContaEmail"
                                class="form-label fw-semibold"
                                data-i18n="cadastroEmail"
                            >
                                E-mail
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="inputContaEmail"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-mblf-primary px-4"
                            id="btnSalvarConta"
                        >

                            <i class="bi bi-check-lg me-1"></i>

                            <span data-i18n="contaSalvarAlteracoes">
                                Salvar alterações
                            </span>

                        </button>

                    </form>

                </div>

            </div>

        </div>



        <!-- =================================================
             SEGURANÇA
        ================================================== -->

        <div class="col-12 col-lg-5">

            <div
                class="card card-custom border-0 shadow-sm h-100"
            >

                <div class="card-body p-4">

                    <div class="mb-4">

                        <h4 class="fw-bold text-main-theme mb-1">

                            <i class="bi bi-shield-lock me-2 text-primary"></i>

                            <span data-i18n="contaSeguranca">
                                Segurança
                            </span>

                        </h4>

                        <p
                            class="small text-muted-theme mb-0"
                            data-i18n="contaSegurancaDesc"
                        >
                            Altere sua senha de acesso.
                        </p>

                    </div>


                    <form id="formSenhaConta">


                        <!-- SENHA ATUAL -->

                        <div class="mb-3">

                            <label
                                for="inputSenhaAtual"
                                class="form-label fw-semibold"
                                data-i18n="contaSenhaAtual"
                            >
                                Senha atual
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="inputSenhaAtual"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <!-- NOVA SENHA -->

                        <div class="mb-3">

                            <label
                                for="inputNovaSenha"
                                class="form-label fw-semibold"
                                data-i18n="contaNovaSenha"
                            >
                                Nova senha
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="inputNovaSenha"
                                minlength="6"
                                autocomplete="new-password"
                                required
                            >

                            <div
                                class="form-text"
                                data-i18n="cadastroSenhaAjuda"
                            >
                                Utilize pelo menos 6 caracteres.
                            </div>

                        </div>


                        <!-- CONFIRMAR NOVA SENHA -->

                        <div class="mb-4">

                            <label
                                for="inputConfirmarNovaSenha"
                                class="form-label fw-semibold"
                                data-i18n="contaConfirmarNovaSenha"
                            >
                                Confirmar nova senha
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="inputConfirmarNovaSenha"
                                minlength="6"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-outline-primary px-4"
                            id="btnAlterarSenha"
                        >

                            <i class="bi bi-key me-1"></i>

                            <span data-i18n="contaAlterarSenha">
                                Alterar senha
                            </span>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer
    class="mt-auto py-4 border-top footer-custom"
>

    <div class="container">

        <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3"
        >

            <div class="d-flex align-items-center gap-2">

                <img
                    src="imagem/LOGO2.png"
                    alt="MBLF Events"
                    width="28"
                >

                <span class="fw-bold text-main-theme">
                    MBLF Events
                </span>

            </div>


            <div class="small text-muted-theme">
                © 2026 MBLF Events
            </div>

        </div>

    </div>

</footer>



<!-- =====================================================
     SCRIPTS
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script src="js/i18n.js"></script>

<script src="js/auth.js"></script>

<script src="js/minhaConta.js"></script>


</body>

</html>
